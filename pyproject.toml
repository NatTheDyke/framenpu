[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framenpu"
version = "0.3.0"
description = "Experimental Steam Frame Hexagon custom jobs and HMX inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "FrameNPU contributors"}]
keywords = ["hexagon", "hmx", "steamos", "steam-frame", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.14", "twine>=6.1", "setuptools>=77"]
cpu = ["onnxruntime"]  # framenpu.backends.CPUBackend

[project.scripts]
framenpu = "framenpu.cli:main"

# device backends framenpu.devices.load() finds (docs/CONTRACTS.md, plugin ABI)
[project.entry-points."framenpu.devices"]
cdsp = "framenpu_cdsp.plugin:CDSPPlugin"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["framenpu", "framenpu_cdsp"]
namespaces = false

[tool.setuptools.package-data]
framenpu = ["data/*.json", "data/*.so", "host/*.c", "host/*.h", "manifests/*.json"]
framenpu_cdsp = [
    "data/*.bin", "data/*.json", "data/*.so", "data/mercury/*", "host/*.c", "host/*.h",
    "sdk/*.S", "sdk/*.c", "sdk/*.ld", "sdk/include/*.h",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]
