[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framenpu"
version = "0.1.0"
description = "Experimental Steam Frame Hexagon custom jobs and HMX inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "FrameNPU contributors"}]
keywords = ["hexagon", "hmx", "steamos", "steam-frame", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.14", "twine>=6.1", "setuptools>=77"]

[project.scripts]
framenpu = "framenpu.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["framenpu"]
namespaces = false

[tool.setuptools.package-data]
framenpu = [
    "data/*.bin", "data/*.json", "data/*.so",
    "host/*.c",
    "sdk/*.S", "sdk/*.c", "sdk/*.ld", "sdk/include/*.h",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]
