[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framenpu"
version = "0.4.2"
description = "Hand-tracking models on the CPU, the Steam Frame CDSP or its NPU service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "FrameNPU contributors"}]
keywords = ["steam-frame", "hand-tracking", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.14", "twine>=6.1", "setuptools>=77"]
cpu = ["onnxruntime"]  # framenpu.backends.CPUBackend
cdsp = ["framenpu-cdsp"]  # the Steam Frame CDSP device backend

[project.scripts]
framenpu = "framenpu.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["framenpu"]
namespaces = false

[tool.setuptools.package-data]
framenpu = ["data/*.json", "data/*.so", "host/*.c", "host/*.h", "manifests/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]
