name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Offline tests
        # failures also become annotations, which are readable without signing in to GitHub
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test.log || {
            awk '/^(FAIL|ERROR): /{t=$0} /^[A-Za-z.]*(Error|Exception|timeout)(:|$)/{print "::error title=" t "::" $0}' test.log
            exit 1
          }
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Repository and payload checks
        run: python tools/check_repository.py
      - name: Build packages and test the wheel from the source archive
        run: |
          python -m build
          python -m twine check dist/*
          python tools/check_distribution.py --dist dist
      - name: The wheel with only its declared dependencies imports and starts
        run: |
          python -m venv "$RUNNER_TEMP/plain"
          "$RUNNER_TEMP/plain/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          plain/bin/python -c "import framenpu.service, framenpu.backends, framenpu.mercury_runtime"
          plain/bin/framenpu serve --help

  models:
    # The whole suite with the real weights present (fetched by hash, tools/fetch_models.py), on the
    # CPU. framenpu-cdsp's CI runs the device path on its lane simulator.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[cpu]"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: models
          key: models-${{ hashFiles('src/framenpu/manifests/*.json', 'tools/fetch_models.py') }}
      - name: Fetch the models
        run: python tools/fetch_models.py models --env | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Tests with the models
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  integration:
    # the tracker, framehands, this commit and framenpu-cdsp together (the tracker's integration/README.md)
    uses: NatTheDyke/steam-frame-hand-tracking/.github/workflows/integration.yml@main
    with:
      framenpu: ${{ github.sha }}
